services:
  postgres:
    image: postgres:17-alpine
    container_name: crikket-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-crikket}
      POSTGRES_HOST_AUTH_METHOD: ${POSTGRES_HOST_AUTH_METHOD:-trust}
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-crikket}"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    image: ghcr.io/redpangilinan/crikket-server:latest
    pull_policy: always
    container_name: crikket-server
    dns:
      - 8.8.8.8
      - 1.1.1.1
    # Hardening, not a bug fix: containers on this host cannot open IPv6 sockets
    # but DNS still returns AAAA, so any outbound call can pick an unreachable
    # address. Force IPv4-only resolution. Applied here because this netns is
    # shared by crikket-web (network_mode: service:server); extra_hosts is
    # rejected outright with a shared network mode.
    # NOTE: this did NOT cause the old ConnectionRefused flood. That was the
    # crikket-web healthcheck rendering the authenticated "/" route under
    # Host: localhost:3001; see its healthcheck below.
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    networks:
      - default
    restart: unless-stopped
    env_file:
      - ./apps/server/.env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "${SERVER_PORT:-3000}:3000"
      - "${WEB_PORT:-3001}:3001"
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3000').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  migrate:
    image: ghcr.io/redpangilinan/crikket-server:latest
    pull_policy: always
    restart: "no"
    env_file:
      - ./apps/server/.env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
    command: ["bun", "run", "--filter", "@crikket/db", "db:migrate"]

  web:
    image: ghcr.io/redpangilinan/crikket-web:latest
    pull_policy: always
    container_name: crikket-web
    restart: unless-stopped
    env_file:
      - ./apps/web/.env
    depends_on:
      server:
        condition: service_healthy
    network_mode: "service:server"
    environment:
      NODE_ENV: production
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3001/login').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
